version: 2
updates:
  # npm — one entry covers the whole yarn workspace (root package.json declares all members).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    labels: []
    open-pull-requests-limit: 10
    groups:
      # Groups we want to review on their own, before the catch-alls below.
      solana-v2-core:
        applies-to: version-updates
        patterns:
          - "@solana/*"
        exclude-patterns:
          - "@solana/web3.js"
          - "@solana/spl-token"
      solana-v2-programs:
        applies-to: version-updates
        patterns:
          - "@solana-program/*"
      codegen-tools:
        applies-to: version-updates
        patterns:
          - "@codama/*"
          - "codama"
      docusaurus:
        applies-to: version-updates
        patterns:
          - "@docusaurus/*"
          - "@algolia/*"
          - "@svgr/*"
          - "@csstools/*"
          - "@img/*"
      nextjs:
        applies-to: version-updates
        patterns:
          - "@next/*"
          - "next"
      # Catch-alls: a dependency lands in the first group it matches, so anything
      # not claimed above collapses into one prod PR and one dev PR.
      npm-production:
        applies-to: version-updates
        dependency-type: "production"
        patterns:
          - "*"
      npm-development:
        applies-to: version-updates
        dependency-type: "development"
        patterns:
          - "*"
      # Security updates are never grouped unless a group opts in explicitly.
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  # cargo — on-chain programs (root workspace = programs/*). Kept separate from the
  # off-chain crates so program dependency bumps get their own review.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
    labels: []
    groups:
      solana-ecosystem:
        applies-to: version-updates
        patterns:
          - "solana-*"
          - "spl-*"
      anchor-framework:
        applies-to: version-updates
        patterns:
          - "anchor-*"
      programs-other:
        applies-to: version-updates
        patterns:
          - "*"
      programs-security:
        applies-to: security-updates
        patterns:
          - "*"

  # cargo — off-chain crates. Every crate here has its own Cargo.lock, and groups only
  # combine within a single update entry, so listing all of them in one entry turns
  # "bump rand in 4 directories" into a single PR instead of four.
  - package-ecosystem: "cargo"
    directories:
      - "/rust-sdk/*"
      - "/ts-sdk/core"
      - "/docs/rust"
      - "/examples/rust-sdk/*"
    schedule:
      interval: "daily"
    labels: []
    open-pull-requests-limit: 10
    versioning-strategy: lockfile-only
    groups:
      solana-sdk:
        applies-to: version-updates
        patterns:
          - "solana-*"
          - "spl-*"
      cargo-other:
        applies-to: version-updates
        patterns:
          - "*"
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels: []
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
