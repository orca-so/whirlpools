# =============================================================================
# TEST BRANCH -- DO NOT MERGE TO main
#
# Throwaway copy of the release workflow, used to exercise the release path as far as it can
# go without releasing anything and without needing any npm-side configuration. The publish is
# a `--dry-run`, and no git writes happen. Every deviation from main is marked `TEST BRANCH:`.
#
# The filename must stay `publish.yml`. npm matches a trusted publisher on the workflow
# filename, so renaming this file would invalidate the exact binding we care about.
#
# Requires no npm settings access. Needs only `permissions: id-token: write`, already set.
#
# What this run PROVES:
#   - npm is >= 11.5.1, so the OIDC code path exists at all (Node 22 shipped npm 10.x)
#   - no `_authToken` line is present to suppress the OIDC exchange
#   - an OIDC context is detected, and the tarball builds with the expected file list
#   - the release set is computed and every build/format step succeeds
# What it CANNOT prove:
#   - that a trusted publisher is configured for @orca-so/whirlpools-sdk on npmjs.com.
#     dry-run reports the auth context but never validates it against the registry
#     (https://github.com/npm/cli/issues/8525). Confirming that needs someone with npm
#     access to read Settings -> Trusted publishing for the package.
#
# Run: gh workflow run publish.yml --ref shio/test-trusted-publishing
# Then read the `Publish Packages` step log for the OIDC/auth lines and the tarball contents.
# =============================================================================

name: Publish

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      # TEST BRANCH: the `Main Only` guard is removed so this can run from a feature branch.
      # npm's trusted publisher config has no branch or ref field -- it matches on org,
      # repository, workflow filename and allowed actions -- so an OIDC token minted from any
      # branch of orca-so/whirlpools is accepted. That is also why `environment` must stay
      # blank above: a GitHub environment is the only thing that would restrict the ref.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ssh-key: ${{ secrets.GH_DEPLOY_KEY }}
      - name: Setup SSH
        uses: ./.github/actions/ssh
        with:
          ssh-key: ${{ secrets.GH_DEPLOY_KEY }}
          user: changests[bot]
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          # Node 24 includes an npm version compatible with trusted publishing.
          # scripts/deploy-npm also enforces the minimum npm version before publishing.
          node-version: 24
          cache: 'yarn'
          # No `registry-url` on purpose. Setting it makes setup-node write
          # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into an .npmrc, but we publish
          # via OIDC and set no NODE_AUTH_TOKEN. The placeholder would expand to an empty token,
          # npm would treat auth as already configured, skip the OIDC exchange, and the registry
          # would reject the anonymous PUT as a misleading "404 Not Found".
          # https://github.com/actions/setup-node/issues/1551
          # Nothing here needs the input anyway: npmjs.com is npm's default registry, we have no
          # private dependencies to authenticate, and Yarn reads .yarnrc.yml rather than .npmrc.
      - name: Show npm version
        run: npm --version
      - name: Setup Rust
        run: |
          rustup toolchain install 1.86.0 --profile minimal
          rustup default 1.86.0
          rustup component add rustfmt clippy
      - name: Install dependencies
        run: yarn install
      # TEST BRANCH: replaces `Check for pending changesets and capture release set`. That step
      # derives the release set from `yarn changeset status`, which diffs against the configured
      # baseBranch ("main" in .changeset/config.json). It cannot work here: actions/checkout
      # makes a depth-1 clone containing only this branch, so `main` does not exist locally and
      # changesets fails with
      #   Failed to find where HEAD diverged from "main". Does "main" exist and it's synced with remote?
      # On main the step works because HEAD is main. Computing the release set is not what this
      # test validates, so pin it to the package we want to dry-run.
      #
      # The fidelity-preserving alternative is `fetch-depth: 0` on checkout plus
      # `git fetch origin main:main`, which gives changesets a real base to diff against.
      - name: Pin release set for test
        run: |
          set -euo pipefail
          echo 'PACKAGES={@orca-so/whirlpools-sdk,}' >> "$GITHUB_ENV"
          echo 'Pinned release set: {@orca-so/whirlpools-sdk,}'
      - name: Build Solana program in Docker
        run: docker compose --profile build run --rm build-solana-program
      - name: Build release set and dependencies
        run: |
          set -euo pipefail
          echo "Building release set: $PACKAGES"
          # skip @orca-so/whirlpools-program here:
          # - it was already built in the previous step via docker
          # - building it in this step would invoke `anchor build`, and anchor isn't installed on the runner
          yarn workspaces foreach -Rp --topological-dev --from $PACKAGES --exclude @orca-so/whirlpools-program run build
      - name: Format packages with auto-generated code
        run: |
          # Format auto-generated ts/js client ts-sdk/client
          yarn workspace @orca-so/whirlpools-lint run format
          # Format auto-generated rust client in rust-sdk/client
          yarn workspace @orca-so/whirlpools-rust-client run format
      # Unchanged from main. Consuming the changeset and writing CHANGELOG.md only affects the
      # runner's throwaway checkout -- this branch never commits or pushes, so the changeset file
      # survives untouched. Letting changesets compute the version is more faithful than forcing
      # one, and it is the same code path that produced 0.22.0 in the failing release.
      - name: Determine New Versions
        run: yarn changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Show resolved version
        run: jq -r '"will dry-run publish \(.name)@\(.version)"' legacy-sdk/whirlpool/package.json
      # TEST BRANCH: `Git Commit` removed -- this branch commits nothing.
      # TEST BRANCH: `Authenticate to crates.io` removed. The release set holds only npm
      # packages, so no cargo publish runs and CARGO_REGISTRY_TOKEN is never read. Dropping it
      # also means a crates.io auth problem cannot fail the run before it reaches npm.
      - name: Publish Packages
        run: yarn workspaces foreach -Rp --topological-dev --from $PACKAGES --exclude @orca-so/whirlpools-monorepo run deploy
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
      # TEST BRANCH: `Tag Release` and `Git Push` removed. Git Push runs
      # `git push origin main`, which must never execute from this branch.
